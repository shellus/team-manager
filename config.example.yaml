# Team Manager 配置示例。复制到私有部署目录后填写；不要把真实值提交到源码仓库。
version: 1
server:
  port: 3000
  dataDir: ./data
  artifactDir: ./data/artifacts
  webDistDirs:
    development: ./source/apps/web/dist
    compose: ./apps/web/dist
  dataEncryptionKey: replace-with-32-byte-key
  dataEncryptionKeyVersion: v1
  jwtSecret: replace-with-random-secret
  jwtIssuer: team-manager
  apiToken: null
  allowedOrigins: []
admin:
  username: admin
  # 可以先填不超过 72 UTF-8 字节的明文；首次读取会原子改写为 bcrypt cost 12。
  password: replace-before-start
database:
  name: team_manager
  username: team_manager
  password: replace-with-database-password
  hosts:
    development:
      host: 127.0.0.1
      port: 5433
    compose:
      host: postgres
      port: 5432
integrations:
  teamCode:
    baseUrl: null
    passcode: null
  stripe:
    publishableKeys: []
    paymentUserAgent: null
    walletConfigId: null
  payment:
    billingPostalCode: null
    billingRegion: null
  # 账号住宅代理网关（可选）。Team Manager 按账号生成 Mihomo 配置并热加载；未配置住宅代理的账号走 worker 默认代理。
  residentialProxy:
    upstream: socks5://user:password@residential.example:3000
    normalProxy: http://front-proxy.example:7890
    stickyMinutes: 120
    listenPort: 3016
    gatewayUrls:
      development: http://127.0.0.1:3018
      compose: http://residential-proxy:3016
    gatewayPassword: replace-with-random-secret
    controllerUrls:
      development: http://127.0.0.1:3019
      compose: http://residential-proxy:9090
    controllerSecret: replace-with-random-secret
    configPath: ./data/residential-proxy/config.yaml
    controllerConfigPath: /root/.config/mihomo/config.yaml
transport:
  curlCffiUrls:
    development: http://127.0.0.1:3011
    compose: http://curl-cffi-worker:8080
  upstreamTraceFile: ./data/upstream-http-trace.jsonl
deployment:
  postgres:
    publishedPort: 5433
  worker:
    chatgptBaseUrl: https://chatgpt.com
    chatgptProxy: null
    impersonate: chrome110
    requestTimeoutSeconds: 60
    ports:
      development: 3011
      compose: 8080
  web:
    devApiTarget: http://127.0.0.1:3000
